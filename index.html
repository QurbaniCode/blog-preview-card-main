<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Blog Preview Card</title>
</head>
<body>
    <main>
        <div class="card">
            <img class="card-img" src="./assets/images/illustration-article.svg" alt="HTML and CSS foundations">
            <div class="card-content">
                <span class="card-content-category">Learning</span>
                <p class="card-content-date">Published 21 Dec 2023</p>
                <h1 class="card-content-title">HTML &amp; CSS foundations</h1>
                <p class="card-content-description">
                    These languages are the backbone of every website,
          defining structure, content, and presentation.
                </p>

            </div>
            <div class="card-author">
                <img class="card-author-img" src="./assets/images/image-avatar.webp" alt="Greg Hooper">
                <span class="card-author-name">Greg Hooper</span>
            </div>
        </div>
    </main>
</body>
</html>
